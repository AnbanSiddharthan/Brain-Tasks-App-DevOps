apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-tasks-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brain-tasks-app
  template:
    metadata:
      labels:
        app: brain-tasks-app
    spec:
      containers:
        - name: brain-tasks-app
          image: 858656722878.dkr.ecr.eu-north-1.amazonaws.com/brain-tasks-app:latest
          imagePullPolicy: Always    
          ports:
            - containerPort: 3000
